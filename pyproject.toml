[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n-migrate"
version = "0.1.0"
description = "Open-source VM migration platform (P2V / V2V / hypervisor-to-hypervisor)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "N-Migrate Contributors" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "sqlmodel>=0.0.16",
    "libvirt-python>=10.0.0",
    "pyVmomi>=8.0.0",
    "paramiko>=3.4.0",
    "pywinrm>=0.4.3",
    "smbprotocol>=1.13.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110.0", "uvicorn[standard]>=0.29.0", "celery>=5.3.0", "redis>=5.0.0"]
converter = ["zeep>=4.2.0"]
dev = ["pytest>=8.0.0", "pytest-mock>=3.12.0", "ruff>=0.4.0", "mypy>=1.9.0", "httpx>=0.27.0"]

[project.scripts]
n-migrate = "n_migrate.cli.main:app"

[tool.setuptools.packages.find]
include = ["n_migrate*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
